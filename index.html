<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>送给你的礼物</title>
<style>
  :root {
    --bg-deep: #0a0604;
    --carrot: #d94a22;
    --carrot-light: #f06030;
    --orange: #ff8c34;
    --orange-light: #ffd4a8;
    --white: #fff2e6;
    --text: #f0ddcc;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 画布背景粒子 ===== */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 主容器 ===== */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 28px 80px;
  }

  /* ===== 顶部装饰线 ===== */
  .top-ornament {
    text-align: center;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeSlideDown 1.2s 0.3s forwards;
  }
  .top-ornament .line {
    display: inline-block;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    margin: 0 8px;
  }
  .top-ornament .star {
    display: inline-block;
    color: var(--orange);
    font-size: 18px;
    animation: starPulse 2s ease-in-out infinite;
  }

  /* ===== 歌词水印背景 ===== */
  .lyrics-watermark {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .lyrics-watermark .line {
    position: absolute;
    color: rgba(255,255,255,0.03);
    font-size: 18px;
    white-space: nowrap;
    letter-spacing: 4px;
    animation: floatLyric 20s linear infinite;
  }
  .lyrics-watermark .line:nth-child(odd) { animation-duration: 25s; animation-delay: -5s; }
  .lyrics-watermark .line:nth-child(3n) { animation-duration: 30s; animation-delay: -12s; font-size: 22px; }

  /* ===== 书名区域 ===== */
  .book-section {
    text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeSlideUp 1s 0.5s forwards;
  }
  .book-icon {
    font-size: 42px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  .book-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--white);
    text-shadow: 0 0 40px rgba(255, 140, 52, 0.4),
                 0 0 80px rgba(220, 90, 50, 0.3);
    animation: glowBreath 3s ease-in-out infinite;
    line-height: 1.4;
  }
  .book-author {
    font-size: 16px;
    color: var(--orange);
    margin-top: 12px;
    letter-spacing: 2px;
    opacity: 0.8;
  }

  /* ===== 分割线 ===== */
  .divider {
    text-align: center;
    margin: 30px 0;
    opacity: 0;
    animation: fadeIn 1s 0.8s forwards;
  }
  .divider .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--orange);
    margin: 0 8px;
    opacity: 0.5;
  }
  .divider .dot:nth-child(2) { opacity: 0.8; animation: dotPulse 1.5s ease-in-out infinite; }
  .divider .dot:nth-child(3) { opacity: 0.5; }

  /* ===== 推荐理由区域 ===== */
  .recommend-section {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 1s 1s forwards;
  }
  .section-label {
    font-size: 13px;
    color: var(--orange);
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .typewriter {
    font-size: 16px;
    line-height: 2;
    color: var(--text);
    letter-spacing: 1px;
    text-align: justify;
    padding: 20px 16px;
    border-left: 2px solid rgba(255, 140, 52, 0.3);
    border-right: 2px solid rgba(255, 140, 52, 0.3);
    position: relative;
  }
  .typewriter p {
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeSlideUp 0.8s forwards;
  }
  .typewriter p:nth-child(1) { animation-delay: 1.3s; }
  .typewriter p:nth-child(2) { animation-delay: 1.8s; }
  .typewriter p:nth-child(3) { animation-delay: 2.3s; }
  .typewriter p:nth-child(4) { animation-delay: 2.8s; }
  .typewriter p:nth-child(5) { animation-delay: 3.3s; }
  .cursor-blink {
    display: inline-block;
    width: 2px; height: 18px;
    background: var(--orange);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.8s step-end infinite;
  }

  /* ===== 祝福语区域 ===== */
  .blessing-section {
    margin-bottom: 40px;
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 2s forwards;
  }
  .blessing-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    line-height: 2;
    background: linear-gradient(90deg,
      var(--orange-light) 0%,
      var(--orange) 25%,
      var(--white) 50%,
      var(--orange) 75%,
      var(--orange-light) 100%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite;
  }

  /* ===== 歌词引用 ===== */
  .lyric-quote {
    text-align: center;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 1s 2.5s forwards;
  }
  .lyric-quote .quote-mark {
    font-size: 36px;
    color: var(--orange);
    opacity: 0.4;
    line-height: 1;
  }
  .lyric-quote .quote-text {
    font-size: 14px;
    color: rgba(255, 242, 230, 0.5);
    letter-spacing: 2px;
    line-height: 2;
    font-style: italic;
  }
  .lyric-quote .quote-source {
    font-size: 12px;
    color: rgba(255, 242, 230, 0.3);
    margin-top: 8px;
  }

  /* ===== 底部礼物动画 ===== */
  .gift-footer {
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 3s forwards;
  }
  .gift-icon {
    font-size: 36px;
    display: inline-block;
    animation: giftBounce 2s ease-in-out infinite;
  }
  .gift-label {
    font-size: 12px;
    color: rgba(255, 242, 230, 0.35);
    letter-spacing: 2px;
    margin-top: 8px;
  }

  /* ===== 音符装饰 ===== */
  .music-note {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    color: rgba(255, 140, 52, 0.15);
    font-size: 24px;
    animation: noteFloat 8s linear infinite;
  }

  /* ===== keyframes ===== */
  @keyframes fadeSlideDown {
    from { opacity:0; transform:translateY(-20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; }
    to   { opacity:1; }
  }
  @keyframes glowBreath {
    0%, 100% { text-shadow: 0 0 30px rgba(255,140,52,0.3), 0 0 60px rgba(220,90,50,0.2); }
    50%      { text-shadow: 0 0 50px rgba(255,140,52,0.6), 0 0 100px rgba(220,90,50,0.4); }
  }
  @keyframes gradientFlow {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  @keyframes starPulse {
    0%,100% { opacity:0.5; transform:scale(1); }
    50%     { opacity:1; transform:scale(1.3); }
  }
  @keyframes dotPulse {
    0%,100% { opacity:0.5; transform:scale(1); }
    50%     { opacity:1; transform:scale(2); }
  }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
  }
  @keyframes giftBounce {
    0%,100% { transform:translateY(0) rotate(0deg); }
    25%     { transform:translateY(-6px) rotate(-3deg); }
    75%     { transform:translateY(-3px) rotate(3deg); }
  }
  @keyframes floatLyric {
    0%   { transform:translateX(100vw) translateY(var(--y)); opacity:0; }
    10%  { opacity:0.03; }
    90%  { opacity:0.03; }
    100% { transform:translateX(-100%) translateY(var(--y)); opacity:0; }
  }
  @keyframes noteFloat {
    0%   { transform:translateY(0) rotate(0deg); opacity:0; }
    10%  { opacity:0.15; }
    90%  { opacity:0.15; }
    100% { transform:translateY(-100vh) rotate(360deg); opacity:0; }
  }

  /* ===== canvas 星星 ===== */
  canvas#stars {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 音乐播放按钮 ===== */
  .music-toggle {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(180, 60, 30, 0.5);
    border: 1.5px solid rgba(255, 140, 52, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    -webkit-tap-highlight-color: transparent;
    animation: musicPulse 2.5s ease-in-out infinite;
  }
  .music-toggle:active {
    transform: scale(0.9);
  }
  .music-toggle .note-icon {
    font-size: 20px;
    color: var(--orange);
    line-height: 1;
    transition: transform 0.3s ease;
  }
  .music-toggle.playing {
    background: rgba(255, 140, 52, 0.2);
    border-color: var(--orange);
    animation: musicSpin 4s linear infinite;
  }
  .music-toggle.playing .note-icon {
    animation: noteBounce 0.6s ease-in-out infinite;
  }
  .music-toggle.paused {
    animation: musicPulse 2.5s ease-in-out infinite;
  }
  .music-toggle.loading {
    animation: none;
    opacity: 0.6;
    pointer-events: none;
  }
  .music-toggle.loading .note-icon {
    animation: dotPulse 1s ease-in-out infinite;
  }
  /* 首次提示 */
  .music-hint {
    position: fixed;
    top: 70px; right: 10px;
    z-index: 10;
    background: rgba(10, 6, 4, 0.9);
    border: 1px solid rgba(255, 140, 52, 0.3);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--orange);
    font-size: 12px;
    letter-spacing: 1px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .music-hint.show {
    opacity: 1;
  }
  .music-hint .arrow {
    position: absolute;
    top: -6px; right: 16px;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 6px solid rgba(255, 140, 52, 0.3);
  }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 140, 52, 0.3); }
    50%      { box-shadow: 0 0 0 10px rgba(255, 140, 52, 0); }
  }
  @keyframes musicSpin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes noteBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-3px) scale(1.1); }
  }
</style>
</head>
<body>

<!-- 星星画布 -->
<canvas id="stars"></canvas>

<!-- 歌词水印 -->
<div class="lyrics-watermark" id="lyricsWatermark"></div>

<!-- 音乐播放按钮 -->
<audio id="bgmAudio" preload="auto" style="display:none;"></audio>
<button class="music-toggle paused" id="musicToggle" title="播放音乐">
  <span class="note-icon">♫</span>
</button>
<div class="music-hint" id="musicHint">
  <span class="arrow"></span>
  点击播放音乐 ♪
</div>

<!-- 主内容 -->
<div class="wrapper">

  <!-- 顶部装饰 -->
  <div class="top-ornament">
    <span class="line"></span>
    <span class="star">✦</span>
    <span class="line"></span>
  </div>

  <!-- 书名 -->
  <div class="book-section">
    <span class="book-icon">📖</span>
    <h1 class="book-title" id="bookTitle">BOOK_TITLE</h1>
    <p class="book-author" id="bookAuthor">BOOK_AUTHOR</p>
  </div>

  <!-- 分割线 -->
  <div class="divider">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <!-- 推荐理由 -->
  <div class="recommend-section">
    <div class="section-label">推 荐 理 由</div>
    <div class="typewriter" id="recommendText"></div>
  </div>

  <!-- 祝福语 -->
  <div class="blessing-section">
    <div class="section-label">送 给 你</div>
    <p class="blessing-text" id="blessingText">BLESSING_TEXT</p>
  </div>

  <!-- 歌词引用 -->
  <div class="lyric-quote">
    <div class="quote-mark">♫</div>
    <p class="quote-text" id="lyricQuote">LYRIC_QUOTE</p>
    <p class="quote-source">—— 五月天 《SONG_NAME》</p>
  </div>

  <!-- 底部礼物 -->
  <div class="gift-footer">
    <span class="gift-icon">🎁</span>
    <p class="gift-label">扫一扫，拆开这份心意</p>
  </div>
</div>

<script>
// ==================== 默认配置（无 URL 参数时的回退值） ====================

const DEFAULTS = {
  bookTitle:   "BOOK_TITLE",
  bookAuthor:  "BOOK_AUTHOR",
  recommend:   ["RECOMMEND_LINE_1", "RECOMMEND_LINE_2", "RECOMMEND_LINE_3"],
  blessing:    "BLESSING_TEXT",
  lyricQuote:  "LYRIC_QUOTE",
  songName:    "SONG_NAME",
  bgm:            "bgm.mp3",
  bgmLoop:        true,
  watermarkLyrics: [
    "你不是真正的快乐", "突然好想你", "我不愿让你一个人",
    "后来的我们", "知足", "温柔", "倔强", "拥抱", "星空", "干杯",
  ]
};

// ==================== 从 URL 参数读取内容 ====================
// 使用 hash 方式传递参数，避免微信内置浏览器截断查询参数
// URL 格式:
//   #t=书名&a=作者&r=理由1|理由2|理由3&b=祝福语&l=歌词引用&s=歌曲名
// 示例:
//   #t=活着&a=余华&r=震撼人心|值得深思|必读经典&b=祝你天天开心&l=我不愿让你一个人&s=我不愿让你一个人

function getParam(key) {
  const hash = window.location.hash.replace(/^#/, "");
  if (!hash) return "";
  const params = new URLSearchParams(hash);
  return params.get(key) || "";
}

function buildConfig() {
  const t = getParam("t");
  const a = getParam("a");
  const r = getParam("r");
  const b = getParam("b");
  const l = getParam("l");
  const s = getParam("s");
  const m = getParam("bgm");

  // 有 URL 参数就用参数值，没有则用默认值
  return {
    bookTitle:   t || DEFAULTS.bookTitle,
    bookAuthor:  a || DEFAULTS.bookAuthor,
    recommend:   r ? r.split("|") : DEFAULTS.recommend,
    blessing:    b || DEFAULTS.blessing,
    lyricQuote:  l || DEFAULTS.lyricQuote,
    songName:    s || DEFAULTS.songName,
    bgm:         m || DEFAULTS.bgm,
    bgmLoop:     getParam("bgm_loop") === "0" ? false : DEFAULTS.bgmLoop,
    watermarkLyrics: DEFAULTS.watermarkLyrics,
  };
}

const CONFIG = buildConfig();

// ==================== 渲染内容 ====================

document.getElementById("bookTitle").textContent = CONFIG.bookTitle;
document.getElementById("bookAuthor").textContent = CONFIG.bookAuthor;

const recommendDiv = document.getElementById("recommendText");
CONFIG.recommend.forEach((line) => {
  if (line.trim()) {
    const p = document.createElement("p");
    p.textContent = line.trim();
    recommendDiv.appendChild(p);
  }
});
// 打字机光标
const cursor = document.createElement("span");
cursor.className = "cursor-blink";
recommendDiv.appendChild(cursor);

document.getElementById("blessingText").textContent = CONFIG.blessing;
document.getElementById("lyricQuote").textContent = CONFIG.lyricQuote;
document.querySelector(".quote-source").textContent =
  "—— 五月天 《" + CONFIG.songName + "》";

// ==================== 背景歌词水印 ====================
(function renderWatermark() {
  const container = document.getElementById("lyricsWatermark");
  const lyrics = CONFIG.watermarkLyrics;
  for (let i = 0; i < 12; i++) {
    const span = document.createElement("span");
    span.className = "line";
    span.textContent = lyrics[i % lyrics.length];
    span.style.setProperty("--y", (Math.random() * 90 + 5) + "vh");
    span.style.top = (Math.random() * 90 + 5) + "%";
    span.style.animationDelay = -(Math.random() * 20) + "s";
    span.style.animationDuration = (20 + Math.random() * 20) + "s";
    container.appendChild(span);
  }
})();

// ==================== 星空粒子 ====================
(function initStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let w, h, stars = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  // 生成星星
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.5,
      alpha: Math.random(),
      alphaSpeed: Math.random() * 0.015 + 0.005,
      alphaDir: Math.random() > 0.5 ? 1 : -1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    // 底部光晕
    const glow = ctx.createRadialGradient(w/2, h*0.7, 0, w/2, h*0.7, Math.min(w,h)*0.6);
    glow.addColorStop(0, "rgba(180,60,30,0.08)");
    glow.addColorStop(1, "rgba(10,6,4,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // 绘制星星
    stars.forEach(s => {
      s.alpha += s.alphaSpeed * s.alphaDir;
      if (s.alpha >= 0.8) s.alphaDir = -1;
      if (s.alpha <= 0.1) s.alphaDir = 1;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,140,52,${s.alpha})`;
      ctx.fill();

      // 大星星加十字光芒
      if (s.r > 1.4) {
        ctx.strokeStyle = `rgba(255,140,52,${s.alpha * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r*4, s.y);
        ctx.lineTo(s.x + s.r*4, s.y);
        ctx.moveTo(s.x, s.y - s.r*4);
        ctx.lineTo(s.x, s.y + s.r*4);
        ctx.stroke();
      }
    });

    requestAnimationFrame(draw);
  }
  draw();

  // 窗口大小变化时更新星星位置
  window.addEventListener("resize", () => {
    resize();
    stars.forEach(s => {
      s.x = Math.min(s.x, w);
      s.y = Math.min(s.y, h);
    });
  });
})();

// ==================== 漂浮音符 ====================
(function spawnNotes() {
  const notes = ["♩","♪","♫","♬","🎵","🎶","🎼"];
  function spawn() {
    const note = document.createElement("span");
    note.className = "music-note";
    note.textContent = notes[Math.floor(Math.random() * notes.length)];
    note.style.left = Math.random() * 90 + "%";
    note.style.bottom = "-30px";
    note.style.animationDuration = (6 + Math.random() * 10) + "s";
    note.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(note);

    setTimeout(() => note.remove(), 16000);
    setTimeout(spawn, 2000 + Math.random() * 4000);
  }
  spawn();
})();

// ==================== BGM 音乐控制 ====================
(function initBGM() {
  const audio = document.getElementById("bgmAudio");
  const toggle = document.getElementById("musicToggle");
  const hint = document.getElementById("musicHint");
  const icon = toggle.querySelector(".note-icon");

  // 如果没配置 bgm，隐藏按钮
  if (!CONFIG.bgm) {
    toggle.style.display = "none";
    if (hint) hint.style.display = "none";
    return;
  }

  audio.src = CONFIG.bgm;
  audio.loop = CONFIG.bgmLoop;

  let isPlaying = false;
  let hasInteracted = false;
  let autoPlayAttempted = false;

  function setState(state) {
    toggle.className = "music-toggle " + state;
    if (state === "playing") {
      icon.textContent = "♪";
      if (hint) hint.classList.remove("show");
    } else if (state === "paused") {
      icon.textContent = "♫";
    } else if (state === "loading") {
      icon.textContent = "♩";
    }
  }

  // 播放
  function play() {
    if (isPlaying) return;
    setState("loading");
    const promise = audio.play();
    if (promise !== undefined) {
      promise.then(() => {
        isPlaying = true;
        setState("playing");
      }).catch((err) => {
        console.log("播放失败:", err.message);
        isPlaying = false;
        setState("paused");
        // 如果是自动播放被阻止，显示提示
        if (!hasInteracted && !autoPlayAttempted) {
          autoPlayAttempted = true;
          if (hint) {
            hint.classList.add("show");
            setTimeout(() => hint.classList.remove("show"), 5000);
          }
        }
      });
    }
  }

  // 暂停
  function pause() {
    audio.pause();
    isPlaying = false;
    setState("paused");
  }

  // 点击切换
  toggle.addEventListener("click", (e) => {
    e.preventDefault();
    hasInteracted = true;
    if (hint) hint.classList.remove("show");

    if (isPlaying) {
      pause();
    } else {
      play();
    }
  });

  // 微信 JS-SDK 就绪后尝试自动播放（不一定成功，取决于微信版本）
  document.addEventListener("WeixinJSBridgeReady", () => {
    play();
  });

  // 音乐加载完成后尝试自动播放
  audio.addEventListener("canplaythrough", () => {
    if (!hasInteracted && !autoPlayAttempted) {
      autoPlayAttempted = true;
      play();
    }
  });

  // 首次显示提示（延迟出现，给自动播放一个机会）
  setTimeout(() => {
    if (!isPlaying && !hasInteracted && autoPlayAttempted) {
      if (hint) hint.classList.add("show");
      setTimeout(() => hint.classList.remove("show"), 5000);
    }
  }, 2500);

  // 页面隐藏时暂停，返回时继续
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (isPlaying) {
        audio.pause();
      }
    } else {
      if (!document.hidden && isPlaying) {
        audio.play().catch(() => {});
      }
    }
  });

  // 音频播放结束后不循环（如需循环可设置 loop 属性）
  audio.addEventListener("ended", () => {
    isPlaying = false;
    setState("paused");
  });

  // 加载错误
  audio.addEventListener("error", () => {
    console.warn("BGM 加载失败:", CONFIG.bgm);
    toggle.style.display = "none";
    if (hint) hint.style.display = "none";
  });
})();
</script>
</body>
</html>

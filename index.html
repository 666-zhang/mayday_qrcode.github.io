<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>送给你的礼物</title>
<style>
  :root {
    --bg-deep: #050914;
    --blue: #1a3a6c;
    --blue-light: #2d5faa;
    --gold: #e8c560;
    --gold-light: #f5e6b8;
    --white: #f0ece4;
    --text: #e0dcd0;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 画布背景粒子 ===== */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 主容器 ===== */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 28px 80px;
  }

  /* ===== 顶部装饰线 ===== */
  .top-ornament {
    text-align: center;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeSlideDown 1.2s 0.3s forwards;
  }
  .top-ornament .line {
    display: inline-block;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 8px;
  }
  .top-ornament .star {
    display: inline-block;
    color: var(--gold);
    font-size: 18px;
    animation: starPulse 2s ease-in-out infinite;
  }

  /* ===== 歌词水印背景 ===== */
  .lyrics-watermark {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .lyrics-watermark .line {
    position: absolute;
    color: rgba(255,255,255,0.03);
    font-size: 18px;
    white-space: nowrap;
    letter-spacing: 4px;
    animation: floatLyric 20s linear infinite;
  }
  .lyrics-watermark .line:nth-child(odd) { animation-duration: 25s; animation-delay: -5s; }
  .lyrics-watermark .line:nth-child(3n) { animation-duration: 30s; animation-delay: -12s; font-size: 22px; }

  /* ===== 书名区域 ===== */
  .book-section {
    text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeSlideUp 1s 0.5s forwards;
  }
  .book-icon {
    font-size: 42px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  .book-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--white);
    text-shadow: 0 0 40px rgba(232, 197, 96, 0.4),
                 0 0 80px rgba(45, 95, 170, 0.3);
    animation: glowBreath 3s ease-in-out infinite;
    line-height: 1.4;
  }
  .book-author {
    font-size: 16px;
    color: var(--gold);
    margin-top: 12px;
    letter-spacing: 2px;
    opacity: 0.8;
  }

  /* ===== 分割线 ===== */
  .divider {
    text-align: center;
    margin: 30px 0;
    opacity: 0;
    animation: fadeIn 1s 0.8s forwards;
  }
  .divider .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin: 0 8px;
    opacity: 0.5;
  }
  .divider .dot:nth-child(2) { opacity: 0.8; animation: dotPulse 1.5s ease-in-out infinite; }
  .divider .dot:nth-child(3) { opacity: 0.5; }

  /* ===== 推荐理由区域 ===== */
  .recommend-section {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 1s 1s forwards;
  }
  .section-label {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .typewriter {
    font-size: 16px;
    line-height: 2;
    color: var(--text);
    letter-spacing: 1px;
    text-align: justify;
    padding: 20px 16px;
    border-left: 2px solid rgba(232, 197, 96, 0.3);
    border-right: 2px solid rgba(232, 197, 96, 0.3);
    position: relative;
  }
  .typewriter p {
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeSlideUp 0.8s forwards;
  }
  .typewriter p:nth-child(1) { animation-delay: 1.3s; }
  .typewriter p:nth-child(2) { animation-delay: 1.8s; }
  .typewriter p:nth-child(3) { animation-delay: 2.3s; }
  .typewriter p:nth-child(4) { animation-delay: 2.8s; }
  .typewriter p:nth-child(5) { animation-delay: 3.3s; }
  .cursor-blink {
    display: inline-block;
    width: 2px; height: 18px;
    background: var(--gold);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.8s step-end infinite;
  }

  /* ===== 祝福语区域 ===== */
  .blessing-section {
    margin-bottom: 40px;
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 2s forwards;
  }
  .blessing-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    line-height: 2;
    background: linear-gradient(90deg,
      var(--gold-light) 0%,
      var(--gold) 25%,
      var(--white) 50%,
      var(--gold) 75%,
      var(--gold-light) 100%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite;
  }

  /* ===== 歌词引用 ===== */
  .lyric-quote {
    text-align: center;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 1s 2.5s forwards;
  }
  .lyric-quote .quote-mark {
    font-size: 36px;
    color: var(--gold);
    opacity: 0.4;
    line-height: 1;
  }
  .lyric-quote .quote-text {
    font-size: 14px;
    color: rgba(240, 236, 226, 0.5);
    letter-spacing: 2px;
    line-height: 2;
    font-style: italic;
  }
  .lyric-quote .quote-source {
    font-size: 12px;
    color: rgba(240, 236, 226, 0.3);
    margin-top: 8px;
  }

  /* ===== 底部礼物动画 ===== */
  .gift-footer {
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 3s forwards;
  }
  .gift-icon {
    font-size: 36px;
    display: inline-block;
    animation: giftBounce 2s ease-in-out infinite;
  }
  .gift-label {
    font-size: 12px;
    color: rgba(240, 236, 226, 0.35);
    letter-spacing: 2px;
    margin-top: 8px;
  }

  /* ===== 音符装饰 ===== */
  .music-note {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    color: rgba(232, 197, 96, 0.15);
    font-size: 24px;
    animation: noteFloat 8s linear infinite;
  }

  /* ===== keyframes ===== */
  @keyframes fadeSlideDown {
    from { opacity:0; transform:translateY(-20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; }
    to   { opacity:1; }
  }
  @keyframes glowBreath {
    0%, 100% { text-shadow: 0 0 30px rgba(232,197,96,0.3), 0 0 60px rgba(45,95,170,0.2); }
    50%      { text-shadow: 0 0 50px rgba(232,197,96,0.6), 0 0 100px rgba(45,95,170,0.4); }
  }
  @keyframes gradientFlow {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  @keyframes starPulse {
    0%,100% { opacity:0.5; transform:scale(1); }
    50%     { opacity:1; transform:scale(1.3); }
  }
  @keyframes dotPulse {
    0%,100% { opacity:0.5; transform:scale(1); }
    50%     { opacity:1; transform:scale(2); }
  }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
  }
  @keyframes giftBounce {
    0%,100% { transform:translateY(0) rotate(0deg); }
    25%     { transform:translateY(-6px) rotate(-3deg); }
    75%     { transform:translateY(-3px) rotate(3deg); }
  }
  @keyframes floatLyric {
    0%   { transform:translateX(100vw) translateY(var(--y)); opacity:0; }
    10%  { opacity:0.03; }
    90%  { opacity:0.03; }
    100% { transform:translateX(-100%) translateY(var(--y)); opacity:0; }
  }
  @keyframes noteFloat {
    0%   { transform:translateY(0) rotate(0deg); opacity:0; }
    10%  { opacity:0.15; }
    90%  { opacity:0.15; }
    100% { transform:translateY(-100vh) rotate(360deg); opacity:0; }
  }

  /* ===== canvas 星星 ===== */
  canvas#stars {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- 星星画布 -->
<canvas id="stars"></canvas>

<!-- 歌词水印 -->
<div class="lyrics-watermark" id="lyricsWatermark"></div>

<!-- 主内容 -->
<div class="wrapper">

  <!-- 顶部装饰 -->
  <div class="top-ornament">
    <span class="line"></span>
    <span class="star">✦</span>
    <span class="line"></span>
  </div>

  <!-- 书名 -->
  <div class="book-section">
    <span class="book-icon">📖</span>
    <h1 class="book-title" id="bookTitle">BOOK_TITLE</h1>
    <p class="book-author" id="bookAuthor">BOOK_AUTHOR</p>
  </div>

  <!-- 分割线 -->
  <div class="divider">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <!-- 推荐理由 -->
  <div class="recommend-section">
    <div class="section-label">推 荐 理 由</div>
    <div class="typewriter" id="recommendText"></div>
  </div>

  <!-- 祝福语 -->
  <div class="blessing-section">
    <div class="section-label">送 给 你</div>
    <p class="blessing-text" id="blessingText">BLESSING_TEXT</p>
  </div>

  <!-- 歌词引用 -->
  <div class="lyric-quote">
    <div class="quote-mark">♫</div>
    <p class="quote-text" id="lyricQuote">LYRIC_QUOTE</p>
    <p class="quote-source">—— 五月天 《SONG_NAME》</p>
  </div>

  <!-- 底部礼物 -->
  <div class="gift-footer">
    <span class="gift-icon">🎁</span>
    <p class="gift-label">扫一扫，拆开这份心意</p>
  </div>
</div>

<script>
// ==================== 配置区域（修改这里的内容即可） ====================

const CONFIG = {
  bookTitle:   "BOOK_TITLE",
  bookAuthor:  "BOOK_AUTHOR",
  recommend: [
    "RECOMMEND_LINE_1",
    "RECOMMEND_LINE_2",
    "RECOMMEND_LINE_3"
  ],
  blessing:    "BLESSING_TEXT",
  lyricQuote:  "LYRIC_QUOTE",
  songName:    "SONG_NAME",
  // 背景水印歌词（会铺满背景缓慢移动）
  watermarkLyrics: [
    "你不是真正的快乐",
    "突然好想你",
    "我不愿让你一个人",
    "后来的我们",
    "知足",
    "温柔",
    "倔强",
    "拥抱",
    "星空",
    "干杯",
  ]
};

// ==================== 渲染内容 ====================

document.getElementById("bookTitle").textContent = CONFIG.bookTitle;
document.getElementById("bookAuthor").textContent = CONFIG.bookAuthor;

const recommendDiv = document.getElementById("recommendText");
CONFIG.recommend.forEach((line, i) => {
  const p = document.createElement("p");
  p.textContent = line;
  recommendDiv.appendChild(p);
});
// 打字机光标
const cursor = document.createElement("span");
cursor.className = "cursor-blink";
recommendDiv.appendChild(cursor);

document.getElementById("blessingText").textContent = CONFIG.blessing;
document.getElementById("lyricQuote").textContent = CONFIG.lyricQuote;
document.querySelector(".quote-source").textContent =
  "—— 五月天 《" + CONFIG.songName + "》";

// ==================== 背景歌词水印 ====================
(function renderWatermark() {
  const container = document.getElementById("lyricsWatermark");
  const lyrics = CONFIG.watermarkLyrics;
  for (let i = 0; i < 12; i++) {
    const span = document.createElement("span");
    span.className = "line";
    span.textContent = lyrics[i % lyrics.length];
    span.style.setProperty("--y", (Math.random() * 90 + 5) + "vh");
    span.style.top = (Math.random() * 90 + 5) + "%";
    span.style.animationDelay = -(Math.random() * 20) + "s";
    span.style.animationDuration = (20 + Math.random() * 20) + "s";
    container.appendChild(span);
  }
})();

// ==================== 星空粒子 ====================
(function initStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let w, h, stars = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  // 生成星星
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.5,
      alpha: Math.random(),
      alphaSpeed: Math.random() * 0.015 + 0.005,
      alphaDir: Math.random() > 0.5 ? 1 : -1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    // 底部光晕
    const glow = ctx.createRadialGradient(w/2, h*0.7, 0, w/2, h*0.7, Math.min(w,h)*0.6);
    glow.addColorStop(0, "rgba(26,58,108,0.08)");
    glow.addColorStop(1, "rgba(5,9,20,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // 绘制星星
    stars.forEach(s => {
      s.alpha += s.alphaSpeed * s.alphaDir;
      if (s.alpha >= 0.8) s.alphaDir = -1;
      if (s.alpha <= 0.1) s.alphaDir = 1;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232,197,96,${s.alpha})`;
      ctx.fill();

      // 大星星加十字光芒
      if (s.r > 1.4) {
        ctx.strokeStyle = `rgba(232,197,96,${s.alpha * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r*4, s.y);
        ctx.lineTo(s.x + s.r*4, s.y);
        ctx.moveTo(s.x, s.y - s.r*4);
        ctx.lineTo(s.x, s.y + s.r*4);
        ctx.stroke();
      }
    });

    requestAnimationFrame(draw);
  }
  draw();

  // 窗口大小变化时更新星星位置
  window.addEventListener("resize", () => {
    resize();
    stars.forEach(s => {
      s.x = Math.min(s.x, w);
      s.y = Math.min(s.y, h);
    });
  });
})();

// ==================== 漂浮音符 ====================
(function spawnNotes() {
  const notes = ["♩","♪","♫","♬","🎵","🎶","🎼"];
  function spawn() {
    const note = document.createElement("span");
    note.className = "music-note";
    note.textContent = notes[Math.floor(Math.random() * notes.length)];
    note.style.left = Math.random() * 90 + "%";
    note.style.bottom = "-30px";
    note.style.animationDuration = (6 + Math.random() * 10) + "s";
    note.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(note);

    setTimeout(() => note.remove(), 16000);
    setTimeout(spawn, 2000 + Math.random() * 4000);
  }
  spawn();
})();
</script>
</body>
</html>
